<!DOCTYPE HTML>
<html lang="pt-br">
        
    <head>
    <meta charset="utf-8">

    <title>Cadastro</title>

        <link rel="stylesheet" href="CSS/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>
    <body >
        <header id="header">
        
                    <div class="Logo"> 
            
                        <img class="logo" src="imagens/logo.png"  alt="logo representando comunidade ecotecnologica">
                        <h1>ECONET </h1>

                </div class="M">
                
                    <div class="cadastro">
                        <a class="menu" href="index.html">Inicio</a>
                        <a class="menu" href="cadastro.html">Seja Voluntário</a>
                
                
                    </div>
            <br>
        </header>
        <br>
    <form>
    <fieldset id="DadosPessoais">
         <legend >Dados pessoais</legend>

                    <div class="Logo"> 
                    <img class="logo" src="imagens/logo.png"  alt="logo representando comunidade ecotecnologica">
            <h1>ECONET </h1>

            </div>      
        <label for="nome">Nome completo:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome completo"
                required
                >
    <br>
        <label for="CPF">CPF:</label>
            <input
                type="text"
                id="CPF"
                name="CPF"
                pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                placeholder="xxx.xxx.xxx-xx"
                required
                >
    <br>
        <label for="email">E-mail:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
                >
    <br>
        <label for="telefone">Telefone:</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                maxlength="11"
                pattern="[0-9]{11}"
                placeholder="Digite seu telefone"
                required
                >
    <br>
        <label for="dataNascimento">Data de nascimento:</label>
            <input
                type="date"
                id="dataNascimento"
                name="dataNascimento"
                required
                >
        </fieldset>
    <br>
        <fieldset id="Endereço">
         <legend>Endereço</legend>

        <label for="endereco">Endereço:</label>
            <input
                type="text"
                id="endereco"
                name="endereco"
                placeholder="Digite seu endereço"
                >
    <br>
        <label for="CEP">CEP</label>
            <input
                type="text"
                id="CEP"
                name="CEP"
                placeholder="xxxxx-xxx"
                pattern="[0-9]{5}-[0-9]{3}"
                required
                >
            <br>
            <label for="cidade">Cidade:</label>
            <input
                type="text"
                id="cidade"
                name="cidade"
                placeholder="Digite sua cidade"
                >
    <br>
            <label for="estado">Estado:</label>
            <input
                type="text"
                id="estado"
                name="estado"
                placeholder="Digite seu estado"
                required
            >
        </fieldset>

        <button type="submit" class="botao" >Enviar</button>
    </form>

    <footer >
        <p>&copy; 2026 ECONET</p> <address>contato@ong.org.br</address>
    </footer>

    </body>
</html>
